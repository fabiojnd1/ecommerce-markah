<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" fill="#EAE5DE" />
  
  <!-- Galhos secos saindo do vaso (ambientação) -->
  <g stroke="#665948" stroke-width="2" stroke-linecap="round">
    <path d="M195 140 Q180 80 150 40" />
    <path d="M170 70 Q145 60 130 65" />
    <path d="M205 140 Q220 70 250 30" />
    <path d="M225 60 Q260 55 270 70" />
    <path d="M200 130 Q195 50 190 20" />
    <!-- Folhas secas em formato orgânico -->
    <ellipse cx="130" cy="65" rx="10" ry="5" fill="#8C7A64" stroke="none" transform="rotate(-20 130 65)" />
    <ellipse cx="150" cy="40" rx="12" ry="6" fill="#A18E76" stroke="none" transform="rotate(-35 150 40)" />
    <ellipse cx="270" cy="70" rx="10" ry="5" fill="#8C7A64" stroke="none" transform="rotate(30 270 70)" />
    <ellipse cx="250" cy="30" rx="12" ry="6" fill="#A18E76" stroke="none" transform="rotate(45 250 30)" />
    <ellipse cx="190" cy="20" rx="10" ry="5" fill="#A18E76" stroke="none" transform="rotate(-5 190 20)" />
  </g>

  <!-- Sombra suave no chão -->
  <ellipse cx="200" cy="415" rx="80" ry="14" fill="#000000" fill-opacity="0.1" filter="blur(6px)" />

  <!-- Vaso Facetado Hera (Terracota Mate) -->
  <g stroke="#A84C26" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="150,140 200,130 250,140 230,155 170,155" fill="#8C3B18" />
    <polygon points="150,140 170,155 130,230 110,210" fill="#D96E43" />
    <polygon points="170,155 200,130 200,240 130,230" fill="#E88258" />
    <polygon points="200,130 250,140 270,230 200,240" fill="#CC653A" />
    <polygon points="250,140 230,155 290,210 270,230" fill="#B8552D" />
    <polygon points="130,230 200,240 180,350 140,330" fill="#D96E43" />
    <polygon points="200,240 270,230 260,330 220,350" fill="#B8552D" />
    <polygon points="200,240 180,350 220,350" fill="#C45E33" />
    <polygon points="140,330 180,350 170,410 145,405" fill="#99401C" />
    <polygon points="180,350 220,350 225,410 170,410" fill="#B34F27" />
    <polygon points="220,350 260,330 255,405 225,410" fill="#8C3B18" />
  </g>

  <text x="200" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B665F" letter-spacing="0.08em">VASO HERA · AMBIENTADO COM BOTÂNICA</text>
</svg>
