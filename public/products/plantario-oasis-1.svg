<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" fill="#F1EEE9" />
  
  <ellipse cx="200" cy="410" rx="80" ry="15" fill="#000000" fill-opacity="0.08" filter="blur(6px)" />

  <!-- Plantário Oasis (Estrutura circular suspensa com nicho para planta) -->
  <g>
    <!-- Aro externo em PLA Terracota Claro -->
    <circle cx="200" cy="240" r="120" stroke="#C9754C" stroke-width="16" fill="none" />
    <circle cx="200" cy="240" r="128" stroke="#B05E35" stroke-width="1" fill="none" />

    <!-- Reservatório inferior integrado -->
    <path d="M120 280 C120 340 280 340 280 280 Z" fill="#DE875E" stroke="#C9754C" stroke-width="1.5" />
    <ellipse cx="200" cy="280" rx="80" ry="12" fill="#803D1E" />
  </g>

  <text x="200" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B665F" letter-spacing="0.08em">PLANTÁRIO OASIS · GEOMÉTRICO</text>
</svg>
