<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" fill="#F1EEE9" />
  
  <!-- Sombra suave no chão -->
  <ellipse cx="200" cy="415" rx="80" ry="14" fill="#000000" fill-opacity="0.08" filter="blur(6px)" />

  <!-- Vaso Facetado Hera (Terracota Mate) -->
  <g stroke="#A84C26" stroke-width="1.2" stroke-linejoin="round">
    <!-- Boca do vaso -->
    <polygon points="150,140 200,130 250,140 230,155 170,155" fill="#8C3B18" />
    
    <!-- Facetas do corpo superior -->
    <polygon points="150,140 170,155 130,230 110,210" fill="#D96E43" />
    <polygon points="170,155 200,130 200,240 130,230" fill="#E88258" />
    <polygon points="200,130 250,140 270,230 200,240" fill="#CC653A" />
    <polygon points="250,140 230,155 290,210 270,230" fill="#B8552D" />

    <!-- Facetas do corpo inferior (afunilando) -->
    <polygon points="130,230 200,240 180,350 140,330" fill="#D96E43" />
    <polygon points="200,240 270,230 260,330 220,350" fill="#B8552D" />
    <polygon points="200,240 180,350 220,350" fill="#C45E33" />
    
    <!-- Base inferior -->
    <polygon points="140,330 180,350 170,410 145,405" fill="#99401C" />
    <polygon points="180,350 220,350 225,410 170,410" fill="#B34F27" />
    <polygon points="220,350 260,330 255,405 225,410" fill="#8C3B18" />
  </g>

  <text x="200" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B665F" letter-spacing="0.08em">VASO FACETADO HERA · TERRACOTA</text>
</svg>
