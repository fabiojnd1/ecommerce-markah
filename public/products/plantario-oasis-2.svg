<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" fill="#EAE5DE" />
  
  <!-- Folhagem cascata (Jiboia) caindo do aro -->
  <g>
    <path d="M190 280 Q170 330 150 370 Q130 400 120 430" stroke="#3D734E" stroke-width="3" fill="none" />
    <ellipse cx="150" cy="350" rx="14" ry="9" fill="#5AA672" transform="rotate(-30 150 350)" />
    <ellipse cx="165" cy="380" rx="15" ry="10" fill="#75C28E" transform="rotate(20 165 380)" />
    <ellipse cx="130" cy="410" rx="13" ry="8" fill="#5AA672" transform="rotate(-40 130 410)" />
    
    <path d="M210 280 Q230 330 250 380" stroke="#3D734E" stroke-width="3" fill="none" />
    <ellipse cx="230" cy="340" rx="14" ry="9" fill="#75C28E" transform="rotate(30 230 340)" />
    <ellipse cx="245" cy="370" rx="12" ry="8" fill="#5AA672" transform="rotate(45 245 370)" />
  </g>

  <!-- Aro e reservatório -->
  <g>
    <circle cx="200" cy="240" r="120" stroke="#C9754C" stroke-width="16" fill="none" />
    <path d="M120 280 C120 340 280 340 280 280 Z" fill="#DE875E" stroke="#C9754C" stroke-width="1.5" />
    <ellipse cx="200" cy="280" rx="80" ry="12" fill="#803D1E" />
  </g>

  <ellipse cx="200" cy="450" rx="80" ry="15" fill="#000000" fill-opacity="0.1" filter="blur(6px)" />
  <text x="200" y="475" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B665F" letter-spacing="0.08em">PLANTÁRIO OASIS · COM FOLHAGEM</text>
</svg>
